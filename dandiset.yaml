studyTarget:
- Role of dorsomedial striatum (DMS) dopamine signaling in development of punishment‑resistant
  (compulsive) reward‑seeking
- Compare dopamine axon activity in dorsomedial (DMS) versus dorsolateral (DLS) striatum
  during RI60 training
- Test causal effects of optogenetic manipulation of DMS dopamine terminals on emergence
  of compulsive reward‑seeking
- Collect and provide dual‑site fiber photometry, behavioral (nosepoke/shock/omission
  probes), and optogenetic stimulation data in Mus musculus for reuse and reanalysis
- Characterize individual variability in punishment‑resistant phenotypes (PR, DPR,
  PS)
